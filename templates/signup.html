{% extends "base.html" %}
{% block title %}Sign up · Tally Claims{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Create your account</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Email <input type="email" name="email" required autocomplete="username" autofocus></label>
    <label>Password (min 8 characters) <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <button class="btn" type="submit">Sign up</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('page_login') }}">Log in</a></p>
</div>
{% endblock %}
